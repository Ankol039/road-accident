  ROADREPORT UI MOCKUP — Notifications
  Route: /admin/notifications
  Source: src/pages/Notifications.jsx

  Do not edit _shared/app.css, other screens, or add new frameworks/fonts.

-->
    <div id="mock-root">
      <div
        class="staff-shell"
        data-rr-screen="notifications"
        data-rr-source="src/pages/Notifications.jsx"

                  <rect
                    x="10"
                    y="10"
                    width="44"
                    height="44"
                    rx="6"
                    transform="rotate(45 32 32)"
                    fill="#F2B705"
                    stroke="#23272B"
                    stroke-width="4"

                  <rect x="29" y="18" width="6" height="18" rx="3" fill="#23272B"></rect>

            <div class="small text-white-50 mt-2">Administrator</div>

          <div class="sidebar-foot">

            </button>
          </div>
          <ul class="list-plain">

                class="notif-row is-unread"
                data-id="Txs9M25EwSerMpOztWBR"

                ><span class="small text-secondary">Oct 21, 2026, 3:38 PM</span>
