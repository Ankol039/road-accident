    <!--
  ROADREPORT UI MOCKUP — My account
  Route: /admin/account
  Source: src/pages/Account.jsx

  This file is a static visual reference. Edit this file and ./screen.css ONLY.
  Do not edit _shared/app.css, other screens, or add new frameworks/fonts.
  Read ../../README.md before changing anything.
  Preserve data-rr-* attributes and {{ ... }} expressions.
  Links point at the sibling mockups; data-rr-href remembers the real SPA route.
-->

          <div class="px-3 pt-3 pb-4">
            <a class="text-decoration-none" href="../dashboard/index.html" data-rr-href="/admin"
              ><span class="brand brand-light"
                ><svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
                  <rect
                    x="10"
                    y="10"
                    width="44"
                    height="44"
                    rx="6"
                    transform="rotate(45 32 32)"
                    fill="#F2B705"
                    stroke="#23272B"
                    stroke-width="4"
                  ></rect>
                  <rect x="29" y="18" width="6" height="18" rx="3" fill="#23272B"></rect>
                  <circle cx="32" cy="43" r="3.5" fill="#23272B"></circle></svg
                ><span>RoadReport</span></span
              ></a
            >
            <div class="small text-white-50 mt-2">Administrator</div>
          </div>
          <div class="rr-account-nav-label" aria-hidden="true">Main menu</div>
          <nav class="side-nav" id="site-nav" aria-label="Main" data-rr-region="shell/nav">
            <a href="../dashboard/index.html" data-rr-href="/admin"><svg class="rr-account-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>Dashboard</a
            ><a href="../reports/index.html" data-rr-href="/admin/reports"><svg class="rr-account-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5"/><path d="M9.5 13h6M9.5 17h4"/></svg>Accident reports</a
            ><a href="../summaries/index.html" data-rr-href="/admin/summaries"
              ><svg class="rr-account-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V11M10 20V4M16 20v-7"/><path d="M2.5 20.5h19"/><path d="M19 4v6m0 0-2.2-2.2M19 10l2.2-2.2"/></svg>Summaries and export</a
            ><a href="../users/index.html" data-rr-href="/admin/users"><svg class="rr-account-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18.5 14.8c1.8.8 3 2.4 3.3 5.2"/></svg>Users</a
            ><a href="../settings/index.html" data-rr-href="/admin/settings"

            ><a href="../notifications/index.html" data-rr-href="/admin/notifications"
              ><svg class="rr-account-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l2 2H4z"/><path d="M10 21.2h4"/></svg>Notifications<span class="count-pill">3</span></a
            ><a
              aria-current="page"
              class="active"
              href="../account/index.html"
              data-rr-href="/admin/account"
              ><svg class="rr-account-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.4 18.2c1.2-2.2 3-3.2 5.6-3.2s4.4 1 5.6 3.2"/></svg>My account</a

          <div class="sidebar-foot">
            <div class="small text-white mb-2 text-truncate" data-user-name="true">Demo User</div>
            <button type="button" class="btn btn-sm btn-outline-light w-100">Log out</button>
          </div>
        </aside>
        <main id="page" class="staff-main" tabindex="-1" data-rr-region="page/root">
          <div class="form-page">
            <header class="rr-account-head">
              <span class="rr-account-eyebrow">Bulacan admin portal</span>
              <h1 class="h3 mb-1" data-rr-region="page/title">My account</h1>
              <p class="text-secondary rr-account-role">Administrator</p>
            </header>
            <div class="rr-account-tape" aria-hidden="true"></div>
            <div class="row g-4 rr-account-grid">
              <div class="col-md-7">
                <form class="panel" id="profile-form" novalidate="">
                  <h2 class="h5">Profile</h2>
                  <div class="mb-3">
                    <label class="form-label" for="full_name">Full name</label
                    ><input
                      id="full_name"
                      class="form-control"
                      autocomplete="name"
                      value="Demo User"
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="email">Email</label
                    ><input
                      id="email"
                      type="email"
                      class="form-control"
                      readonly=""
                      value="admin@example.gov.ph"
                    />
                    <div class="form-text">Email changes are made by an administrator.</div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="phone">Mobile number</label
                    ><input
                      id="phone"
                      type="tel"
                      class="form-control"
                      placeholder="09XXXXXXXXX"
                      autocomplete="tel"
                      value=""
                    />
                  </div>
                  <button class="btn btn-guide" type="submit">Save profile</button>
                </form>
              </div>
              <div class="col-md-5">
                <form class="panel" id="password-form" novalidate="">
                  <h2 class="h5">Change password</h2>
                  <div class="mb-3">
                    <label class="form-label" for="pw-current">Current password</label
                    ><input
                      id="pw-current"
                      type="password"
                      class="form-control"
                      autocomplete="current-password"
                      value=""
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="pw-new">New password</label
                    ><input
                      id="pw-new"
                      type="password"
                      class="form-control"
                      autocomplete="new-password"
                      value=""
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="pw-confirm">Confirm new password</label
                    ><input
                      id="pw-confirm"
                      type="password"
                      class="form-control"
                      autocomplete="new-password"
                      value=""
                    />
                  </div>
                  <button class="btn btn-guide" type="submit">Change password</button>
                </form>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script>
      /*
       * Burger menu (mockup behaviour): the button opens and closes the sidebar's navigation
       * on small screens. It keeps aria-expanded and the accessible name in sync, closes on
       * Escape or after choosing a link, and resets when the window grows past 992px.
       */
      (function () {
        var aside = document.querySelector(".staff-shell .sidebar");
        var btn = aside && aside.querySelector(".rr-account-burger");
        if (!btn) return;
        var OPEN = "rr-account-menu-open";
        function set(open) {
          aside.classList.toggle(OPEN, open);
          btn.setAttribute("aria-expanded", open ? "true" : "false");
          btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        }
        btn.addEventListener("click", function () {
          set(!aside.classList.contains(OPEN));
        });
        aside.addEventListener("click", function (e) {
          if (e.target.closest(".side-nav a")) set(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && aside.classList.contains(OPEN)) {
            set(false);
            btn.focus();
          }
        });
        window.matchMedia("(min-width: 992px)").addEventListener("change", function (e) {
          if (e.matches) set(false);
        });
      })();
    </script>
  </body>
</html>
