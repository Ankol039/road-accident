<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1214" />
    <title>Login — RoadReport mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../_shared/bootstrap.min.css" />
    <link rel="stylesheet" href="../../_shared/leaflet.css" />
    <link rel="stylesheet" href="../../_shared/app.css" />
    <link rel="stylesheet" href="../../_shared/mock.css" />
    <link rel="stylesheet" href="./screen.css" />
  </head>
  <body>
    <!--
  ROADREPORT UI MOCKUP — Login
  Route: /login
  Source: src/pages/Login.jsx

  This file is a static visual reference. Edit this file and ./screen.css ONLY.
  Do not edit _shared/app.css, other screens, or add new frameworks/fonts.
  Read ../../README.md before changing anything.
  Preserve data-rr-* attributes and {{ ... }} expressions.
  Links point at the sibling mockups; data-rr-href remembers the real SPA route.
-->
    <div id="mock-root">
      <div class="auth-page rr-login-page">
        <div class="rr-login-tape" aria-hidden="true"></div>
        <div class="rr-login-road" aria-hidden="true"></div>
        <form class="auth-card rr-login-card" id="login-form" novalidate="">
          <div class="rr-login-lamps" aria-hidden="true"><span></span><span></span><span></span></div>
          <a
            class="text-decoration-none d-inline-block mb-3"
            href="../landing/index.html"
            data-rr-href="/"
            ><span class="brand"
              ><svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
                <rect
                  x="10"
                  y="10"
                  width="44"
                  height="44"
                  rx="6"
                  transform="rotate(45 32 32)"
                  fill="#F2B705"
                  stroke="#23272B"
                  stroke-width="4"
                ></rect>
                <rect x="29" y="18" width="6" height="18" rx="3" fill="#23272B"></rect>
                <circle cx="32" cy="43" r="3.5" fill="#23272B"></circle></svg
              ><span>RoadReport</span></span
            ></a
          >
          <span class="rr-login-eyebrow">Bulacan admin portal</span>
          <h1 class="h4" data-rr-region="page/title">Staff log in</h1>
          <p class="small text-secondary">
            This portal is for authorized administrators and traffic officers. Reporters use the RoadReport mobile app.
          </p>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              class="form-control"
              autocomplete="username"
              required=""
              value=""
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label
            ><div class="rr-login-field">
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              autocomplete="current-password"
              required=""
              value=""
            />
            <button
              type="button"
              class="rr-login-toggle"
              id="password-toggle"
              aria-controls="password"
              aria-pressed="false"
              aria-label="Show password"
            >
              <svg class="rr-login-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="rr-login-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18"/><path d="M10.6 5.7A10.6 10.6 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 4"/><path d="M6.5 6.9C3.7 8.7 2 12 2 12s3.6 6.5 10 6.5c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
            </div>
          </div>
          <button type="submit" class="btn btn-guide w-100">Log in</button>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <button type="button" class="btn btn-link btn-sm p-0">Forgot password</button
            ><a class="small text-secondary" href="../landing/index.html" data-rr-href="/"
              >Back to home</a
            >
          </div>
        </form>
        <p class="rr-login-foot">© RoadReport · Bulacan, Philippines · For authorized administrators and traffic officers</p>
      </div>
      <div class="toast-box" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script>
      /*
       * Show / hide password (mockup behaviour).
       * The button flips the input between type="password" and type="text" and keeps
       * aria-pressed and the accessible name in sync. In the app, do the same with state.
       */
      (function () {
        var input = document.getElementById("password");
        var btn = document.getElementById("password-toggle");
        if (!input || !btn) return;
        btn.addEventListener("click", function () {
          var show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.setAttribute("aria-pressed", show ? "true" : "false");
          btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
      })();
    </script>
  </body>
</html>
